name: Discover Reference Reels

on:
  schedule:
    # 매일 18:23 UTC = 03:23 KST. 정각 예약은 GitHub 지연이 3~6시간이라 분을 옮김 (06:06 선별 작업보다 먼저 끝나야 함)
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 노션에 쓰지 않고 로그만'
        default: '0'
      hashtag_test:
        description: '해시태그를 넣으면 발굴 대신 top_media 테스트만 함'
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hashtag test
        if: ${{ github.event.inputs.hashtag_test != '' }}
        run: node discover_reels.js --hashtag "${{ github.event.inputs.hashtag_test }}"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      - name: Discover
        if: ${{ github.event.inputs.hashtag_test == '' }}
        run: node discover_reels.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
